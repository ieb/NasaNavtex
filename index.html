<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Navtex</title>

    <link rel="manifest" href="/navtex/manifest.json" crossorigin="use-credentials" />

    <!-- Note, a localhost server is still required as the service worker cache doesnt scale even 
    with sharded caches. At 10K resource the repsonse times are 80ms vs 3ms for a local server.
    Seems lime cache.match does not scale well.
    All caching is disabled in the server worker. -->
    <script type="text/javascript">
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/navtex/worker.js', { scope: '/navtex/', type: 'module' });
          navigator.serviceWorker.ready.then((registration) => {
            const cacheEnabled = !window.location.hash.includes('disableCache');
            registration.active.postMessage({ cacheEnabled });
          });
        }

    </script>

    <script src="./deps/ol.js"></script>
    <script src='./deps/harbours.js'></script>
    <script src='./deps/map_utils.js'></script>
    <script src='./deps/utilities.js'></script>
    
    <script type="module" src="ui.js"></script>


<style>
    .messageBody {
        display: none;
    }
    #safe {
        display: none;
    }
    .messageId:hover {
        background-color: seagreen;
    }
    .messageId[selected='selected'] {
        background-color: palegreen;
    }
    #messageIds {
        margin-right: 1rex;
        height: 700px;
        width: 75px;
        min-width: 75px;
        overflow-y: scroll;
        overflow-x: hidden;
    }
    #messageBodies {
        overflow-y: auto;
        height: 700px;
        margin: 1rex;
        display: grid;
    }
    .messageBody[selected='selected'] {
        display: block;
        float: right;
        font-family: monospace;
        border: 1px solid;
        margin: 3px;
        padding: 3px;
        background-color: none;
    }
    .messageBody[focused='focused'] {
        background-color: lightyellow;
    }
    div[wzcancel='true'] {
        background-color: dimgrey;
    }
    .messageListing {
        display: flex;
    }
    .latlon {
        background-color: lightgreen;
    }
    .latlon2 {
        background-color: lightblue;
    }
    .latlon3 {
        background-color: lightslategrey;
    }
    .latlon[selected='selected'] {
        background-color: yellowgreen;
    }
    #map {
        flex-shrink: 0;
        margin-left: auto;
        height: 700px;
        width: 800px;
    }
    .ol-attribution {
        display: none;
    }
    .controls {
        display: flex;
    }


    #import_modal[visible='no'] {
        display: none;
    }
    #import_modal[visible='yes'] {
        position: fixed;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #import_instructions {
      width: 90%;
      padding: 10px;
        background-color: lightgrey;
    }


    #sourceMessages {
      margin: auto;
      flex-grow: 1;
      width: 90%;
    }

    #import_modal_import {
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
      background-color: rgb(0, 123, 255);
      color: white;
      cursor: pointer;
    }

    #import_modal_cancel {
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
      background-color: rgb(0, 123, 255);
      color: white;
      cursor: pointer;
    }

    .buttons {
       display: inline-block; 
    }
</style>
</head>
<body>
<div class="controls" >
    <div>
        <button id="connect">Sync</button>
        <button id="import_modal_show">Import</button>
        <button id="clear">Clear</button> 
        <button id="loadmap">LoadMap</button> 
        <button id="loadCache">load Cache</button> 
        <button id="listAllCaches">list Caches</button> 
        <button id="purgeDiskCache">purge Disk Cache</button> 
        <button id="purgeWorkerCache">purge Worker Cache</button> 
        <input type="text" id="search" name="search">
        <div>
            <select id="navarea">
                <option id="I">I North Atlantic, North Sea, Baltic Sea</option>
                <option id="II">II East Atlantic</option>
                <option id="III">III Mediterranean Sea</option>
                <option id="IV">IV West Atlantic</option>
                <option id="V">V Brasil (none use Imarsat C)</option>
                <option id="VI">VI Argentina, Uruguay</option>
                <option id="VII">VII South Africa</option>
                <option id="VIII">VIII India</option>
                <option id="IX">IX Arabia</option>
                <option id="X">X Australia, Imarsat C only</option>
                <option id="XI">XI East Asia</option>
                <option id="XII">XII Eastern Pacific</option>
                <option id="XIII">XIII Russia</option>
                <option id="XIV">XIV New Zealand, Southern Pacific, none</option>
                <option id="XV">XV Chile</option>
                <option id="XVI">XVI Peru</option>
            </select> 
        </div>
        <div>
            <input type="checkbox" id="frequency_a" name="frequency_a" checked />
            <label for="scales">512KHz</label>
            <input type="checkbox" id="frequency_b" name="frequency_b" checked />
            <label for="scales">490KHz</label>
            <input type="checkbox" id="frequency_c" name="frequency_c" checked />
            <label for="scales">UK Costal</label>
            <input type="checkbox" id="frequency_1" name="frequency_1" checked />
            <label for="scales">Navarea 1</label>

        </div>
    </div>
    <div>
        <div>
            <select id="stations" multiple="multiple">
                <option id="bA">512KHz A Svalbard NOR</option>
                <option id="aB">512KHz B Bodø    NOR</option> 
                <option id="aC">512KHz C Vardø   NOR</option> 
                <option id="aD">512KHz D Tórshavn    FRO</option> 
                <option id="aE">512KHz E Niton   GBR</option> 
                <option id="aG">512KHz G Cullercoats GBR</option> 
                <option id="aH">512KHz H Bjuröklubb  SWE</option> 
                <option id="aI">512KHz I Grimeton    SWE</option> 
                <option id="aJ">512KHz J Gislövshammar SWE</option>
                <option id="aK">512KHz K Niton   GBR</option> 
                <option id="aL">512KHz L Rogaland    NOR</option> 
                <option id="aM">512KHz M Jeløy   NOR</option> 
                <option id="aN">512KHz N Ørlandet    NOR</option> 
                <option id="aO">512KHz O Portpatrick GBR</option> 
                <option id="aP">512KHz P Netherlands Coastguard  NLD</option> 
                <option id="aQ">512KHz Q Malin Head  IRL</option> 
                <option id="aR">512KHz R Saudanes    ISL</option> 
                <option id="aS">512KHz S Pinneberg   DEU</option> 
                <option id="aT">512KHz T Oostende    BEL</option> 
                <option id="aF">512KHz F Tallinn EST</option> 
                <option id="aV">512KHz V Oostende    BEL</option> 
                <option id="aW">512KHz W Valentia    IRL</option> 
                <option id="bX">512KHz X Grindavik   ISL</option> 
                <option id="bB">490KHz B Oostende    BE</option>
                <option id="bC">490KHz C Portpatrick GBR</option>
                <option id="bE">490KHz E Saudanes    ISL</option>
                <option id="bI">490KHz I Niton   GBR</option>
                <option id="bK">490KHz K Grindavik   ISL</option>
                <option id="bL">490KHz L Pinneberg   DEU</option>
                <option id="bU">4990KHz U Cullercoats GBR</option>
                <option id="1U">NA1 U Navarea 1</option>                
                <option id="1U">UKC U UK Coastal</option>
            </select>
        </div>
    </div>
    <div>
        <div>            
            <select id="messageTypes" multiple="multiple">
                <option id="A" >A Navigational warnings</option>
                <option id="B" >B Meteorological warnings</option>
                <option id="C" >C Ice reports</option>
                <option id="D" >D Search & rescue, and pirate warnings</option>
                <option id="E" >E Meteorological forecasts</option>
                <option id="F" >F Pilot service</option>
                <option id="G" >G AIS messages</option>
                <option id="H" >H LORAN messages</option>
                <option id="I" >I OMEGA messages</option>
                <option id="J" >J SATNAV messages</option>
                <option id="K" >K Other electronic</option>
                <option id="L" >L Navigational warnings</option>
                <option id="T" >T Test transmissions</option>
                <option id="V" >V Notice to fishermen</option>
                <option id="W" >W Environmental</option>
                <option id="X" >X Special services</option>
                <option id="Y" >Y Special services</option>
                <option id="Z" >Z No message</option>
            </select>
        </div>
        
    </div>
    <div>
    <span id="status"></span>
    </div>
</div>
<div>
<div class="messageListing">
<div id="messageIds"> </div>
<div id="messageBodies"> </div>
<div id="map" >
</div>

</div>

<div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
    <div id="popup-content"></div>
</div>

<div id="import_modal" visible='no'>
    <div id="import_instructions">Goto <a href="https://msi.admiralty.co.uk/RadioNavigationalWarnings">https://msi.admiralty.co.uk/RadioNavigationalWarnings</a>, select all, then copy paste the message text here, then press import</div>
    <textarea id='sourceMessages'></textarea>
    <div class="buttons">
    <button id="import_modal_import">Import</button>
    <button id="import_modal_cancel">Cancel</button>
    </div>

<div>

</body>
</html>
